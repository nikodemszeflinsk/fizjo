<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Panel gabinetu — demo · Studio Widok</title>
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml" />
  <meta name="description" content="Prototyp panelu do zarządzania wizytami w gabinecie fizjoterapii: dzień, kalendarz, pacjenci, karty terapii i ćwiczenia." />
  <meta name="theme-color" content="#14171A" />
  <meta name="robots" content="noindex" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;500;700&family=Overpass:wght@600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/crm.css?v=11" />
</head>
<body>
  <a class="skip" href="#widok">Przejdź do treści</a>

  <aside class="demo-bar" id="demo-bar">
    <p><strong>Prototyp panelu</strong> od Studio Widok. Zmiany zapisują się w tej przeglądarce; SMS-y i e-maile nie wychodzą na zewnątrz.</p>
    <a class="demo-bar__link" href="index.html">
      Wróć do oferty
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 10h11m-4-4 4 4-4 4" /></svg>
    </a>
    <button class="demo-bar__close" type="button" aria-label="Ukryj pasek demo">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="m5 5 10 10M15 5 5 15" /></svg>
    </button>
  </aside>

  <div class="app">
    <nav class="rail" aria-label="Sekcje panelu">
      <a class="rail__brand" href="index.html" aria-label="Studio Widok — oferta">
        <svg class="rail__mark" viewBox="0 0 40 40" aria-hidden="true">
          <path d="M8 6v20a8 8 0 0 1-3 6" style="stroke:#1F5FD6" />
          <path d="M15 6v28" style="stroke:#E8590C" />
          <path d="M22 6v28" style="stroke:#13875A" />
          <path d="M29 6v28" style="stroke:#C2255C" />
          <path d="M36 6v28" style="stroke:#F2B705" />
        </svg>
        <span id="brand-name">Linia Ruchu</span>
      </a>

      <ul class="rail__list" id="rail-list"></ul>

      <div class="rail__foot">
        <p class="rail__who">
          <span class="avatar" aria-hidden="true" id="rail-inicjaly">JK</span>
          <span id="rail-terapeuta"></span>
        </p>
      </div>
    </nav>

    <header class="top">
      <button class="top__menu" type="button" id="menu" aria-label="Menu sekcji" aria-expanded="false">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3.5 6h13M3.5 10h13M3.5 14h13" /></svg>
      </button>

      <div class="top__title">
        <h1 id="view-title">Dziś</h1>
        <p id="view-date"></p>
      </div>

      <div class="search">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M9 15.5a6.5 6.5 0 1 0 0-13 6.5 6.5 0 0 0 0 13ZM17 17l-3.4-3.4" /></svg>
        <label class="visually-hidden" for="search">Szukaj pacjenta</label>
        <input id="search" type="search" placeholder="Szukaj pacjenta albo numeru…" autocomplete="off" />
        <ul class="search__out" id="search-out" hidden></ul>
      </div>

      <button class="btn btn--accent" type="button" data-akcja="nowa-wizyta">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 4.5v11M4.5 10h11" /></svg>
        Umów wizytę
      </button>
    </header>

    <main class="view" id="widok">
      <section class="panel" id="dzis" aria-labelledby="view-title"></section>
      <section class="panel" id="kalendarz" hidden></section>
      <section class="panel" id="pacjenci" hidden></section>
      <section class="panel" id="wiadomosci" hidden></section>
      <section class="panel" id="miesiac" hidden></section>
      <section class="panel" id="ustawienia" hidden></section>
    </main>
  </div>

  <!-- Karta pacjenta -->
  <div class="drawer" id="drawer" hidden>
    <div class="drawer__veil" data-close></div>
    <aside class="drawer__panel" role="dialog" aria-modal="true" aria-labelledby="drawer-name">
      <button class="drawer__close" type="button" data-close aria-label="Zamknij kartę pacjenta">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="m5 5 10 10M15 5 5 15" /></svg>
      </button>
      <div id="drawer-body"></div>
    </aside>
  </div>

  <!-- Okno dialogowe: umawianie, formularze, potwierdzenia -->
  <div class="modal" id="modal" hidden>
    <div class="modal__veil" data-close></div>
    <div class="modal__box" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <header class="modal__head">
        <h2 id="modal-title"></h2>
        <button class="modal__close" type="button" data-close aria-label="Zamknij">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="m5 5 10 10M15 5 5 15" /></svg>
        </button>
      </header>
      <div class="modal__body" id="modal-body"></div>
      <footer class="modal__foot" id="modal-foot"></footer>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite">
    <span id="toast-text"></span>
    <button class="toast__undo" type="button" id="toast-undo" hidden>Cofnij</button>
  </div>

  <script src="assets/js/konfiguracja.js?v=1"></script>
  <script src="assets/js/store.js?v=7"></script>
  <script src="assets/js/crm.js?v=10"></script>
</body>
</html>
